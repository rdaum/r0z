on: [push, pull_request]

name: Continuous integration

jobs:
  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            packages: --workspace
          - os: macos-latest
            packages: --workspace
          - os: windows-latest
            packages: --workspace --exclude r0z-async
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Cargo build
        run: cargo build ${{ matrix.packages }} --all-targets
  test:
    name: Test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            packages: --workspace
          - os: macos-latest
            packages: --workspace
          - os: windows-latest
            packages: --workspace --exclude r0z-async
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Cargo test
        run: cargo test ${{ matrix.packages }} --all-targets
      - name: Cargo doc tests
        run: cargo test ${{ matrix.packages }} --doc
  lint:
    name: Lint
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            packages: --workspace
          - os: macos-latest
            packages: --workspace
          - os: windows-latest
            packages: --workspace --exclude r0z-async
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Cargo clippy
        run: cargo clippy ${{ matrix.packages }} --all-targets -- -D warnings
  async-adapters:
    name: Async adapters
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: ["", "async-io", "tokio,async-io"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Check the async core and selected adapters
        run: cargo check -p r0z-async --no-default-features --features '${{ matrix.features }}' --lib
      - name: Test the selected adapters
        run: cargo test -p r0z-async --no-default-features --features '${{ matrix.features }}' --all-targets
      - name: Test documentation
        run: cargo test -p r0z-async --no-default-features --features '${{ matrix.features }}' --doc
      - name: Lint the selected adapters
        run: cargo clippy -p r0z-async --no-default-features --features '${{ matrix.features }}' --all-targets -- -D warnings
      - name: Verify the dependency graph excludes Tokio
        if: matrix.features == '' || matrix.features == 'async-io'
        shell: bash
        run: |
          cargo tree -p r0z-async --no-default-features --features '${{ matrix.features }}' --edges normal,build --prefix none --format '{p}' > async-dependencies.txt
          if rg '^tokio ' async-dependencies.txt; then
            exit 1
          fi
      - name: Run the async-io example
        if: matrix.features == 'async-io'
        run: cargo run -p r0z-async --no-default-features --features async-io --example async_io
