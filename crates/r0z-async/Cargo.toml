[package]
name = "r0z-async"
version = "0.5.0"
authors = [
    "cetra3 <cetra3@hotmail.com>",
    "skrap <jonah@petri.us>",
    "kobzol <berykubik@gmail.com>",
    "YushiOMOTE <yushiomote@gmail.com>",
    "iddm <fx@thefx.co>",
]
edition = "2021"
license.workspace = true
publish = false
readme = "README.md"
repository.workspace = true
description = "Async bindings to native ZeroMQ (libzmq), with optional runtime adapters"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
async-io = ["dep:async-io"]

[dependencies]
async-io = { workspace = true, optional = true }
futures.workspace = true
log.workspace = true
r0z.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
async-executor.workspace = true
criterion.workspace = true
futures = { workspace = true, features = ["async-await"] }
pretty_env_logger.workspace = true
rand.workspace = true
tempfile.workspace = true

[[bench]]
name = "poll"
harness = false
required-features = ["tokio"]

[[bench]]
name = "owned_send"
harness = false
required-features = ["tokio"]

[[example]]
name = "client_worker"
required-features = ["tokio"]

[[example]]
name = "publish"
required-features = ["tokio"]

[[example]]
name = "pull"
required-features = ["tokio"]

[[example]]
name = "push"
required-features = ["tokio"]

[[example]]
name = "reply"
required-features = ["tokio"]

[[example]]
name = "request"
required-features = ["tokio"]

[[example]]
name = "subscribe"
required-features = ["tokio"]

[[example]]
name = "async_io"
required-features = ["async-io"]

[[example]]
name = "request_timeout"
required-features = ["tokio"]
