[workspace]
resolver = "2"
members = ["crates/r0rz", "crates/r0rz-sys", "crates/r0rz-async"]
exclude = ["fuzz", "msrv-test"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rdaum/rust-zmq"

[workspace.dependencies]
r0rz = { version = "0.10.0", path = "crates/r0rz" }
r0rz-sys = { version = "0.13.0", path = "crates/r0rz-sys", features = ["libsodium"] }
bitflags = "2.3"
libc = "0.2.25"
libsodium-sys-stable = "1.0"
zeromq-src = "0.3.6"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["net"] }
log = "0.4.3"
thiserror = "1"
trybuild = "1"
env_logger = { version = "0.11", default-features = false }
nix = { version = "0.31", features = ["poll"] }
quickcheck = "1"
rand = "0.8"
tempfile = "3"
timebomb = "0.1.2"
pretty_env_logger = "0.5"
criterion = "0.5"
